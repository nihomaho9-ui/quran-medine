<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Mushafuk</title>
    <link rel="icon" href="./icon.png" />

    <meta name="apple-mobile-web-app-title" content="Mushafuk" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; -webkit-tap-highlight-color: transparent; }
      #page, #page * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      body {
        background: #fffaf0;
        color: #1a1612;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }
      header {
        background: #fffaf0;
        color: #6a5e4c;
        padding: calc(0.28rem + env(safe-area-inset-top)) 0.75rem 0.05rem;

        align-items: center;
        justify-content: flex-start;
        gap: 0.35rem;

      header a {

        line-height: 1;

      header h1 { margin: 0; font-size: 0.9rem; font-weight: 500; }

        text-align: center;
        color: #8a7d68;
        font-size: 0.68rem;
        padding: 0.05rem 0 calc(0.22rem + env(safe-area-inset-bottom));
        background: #fffaf0;
      }
      .page {
        --rows: 15;
        flex: 1;
        min-height: 0;
        margin: 0;
        background: #fffaf0;
        border: none;
        border-radius: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .page.mid { justify-content: center; position: relative; }
      .page.mid .line { flex: 0 0 calc(100% / var(--rows)); }
      .page.mid .line:not(.surah) { transform: translateY(calc(var(--up, 0px) * -1)); }
      .page.mid .line.surah {
        position: absolute;
        left: 0;
        right: 0;
        height: calc(100% / var(--rows));
        flex: none;
        top: calc(50% - var(--up, 0px) - var(--half, 3.5) * 100% / var(--rows) - 155% / var(--rows));
      }
      .line {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        white-space: nowrap;
        direction: rtl; /* the ayah runs are flex items: lay them out right-to-left like the text inside them */
      }
      .line.surah { color: #1a1612; }
      .shead {
        position: relative;
        width: 96%;
        height: 96%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .shead img { position: absolute; inset: 0; width: 100%; height: 100%; }
      .snames {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.28em;
        direction: rtl;
      }
      .sname {
        font-family: surahnames, serif;
        line-height: 1;
        color: #1a1612;
      }
      .basmala {
        font-family: QCF1, serif;
        font-size: 1em;
        line-height: 1;
        direction: rtl;
        color: #1a1612;
      }
      .line.stack { flex: 1.75 1 0; flex-direction: column; justify-content: center; }
      .line.stack .shead { height: 52%; width: 90%; }
      .line.stack .basmala { font-size: 0.72em; }
      @media (orientation: portrait) and (max-width: 520px) {
        .page:not(.mid) { justify-content: center; }
        .page:not(.mid) .line { flex: 0 1 calc(100% / 16.7); }
        .page:not(.mid) .line.stack { flex: 0 1 calc(175% / 16.7); }
      }
      @media (orientation: landscape) and (max-height: 520px) {
        header { display: none; }
        .num { display: none; }
        .page {
          margin: 0;
          border: none;
          border-radius: 0;
          overflow: auto;
          touch-action: pan-y;
          justify-content: flex-start;
          padding: 0.55em 0 0.8em;
        }
        .page.mid { justify-content: flex-start; }
        .page .line,
        .page.mid .line,
        .page.mid .line.surah,
        .page.mid .line:not(.surah) {
          flex: 0 0 auto;
          position: static;
          top: auto;
          height: auto;
          min-height: 2.45em;
          transform: none;
        }
        .shead { height: 1.45em; width: 94%; }
      }
      @media (orientation: landscape) and (min-height: 521px) {

        .page { margin: 0; border: none; border-radius: 0; overflow: hidden; }
      }
